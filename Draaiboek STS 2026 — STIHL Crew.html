<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draaiboek STS 2026</title>
<style>
:root{
  --bg:#101114; --card:#1b1d22; --card2:#22252b; --line:#2c2f36;
  --text:#f2f2f0; --sub:#a6a9b0; --accent:#e8722c; --accent2:#3fa6ff;
  --pill:#2c2f36; --pillText:#cfd2d8;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f4f2; --card:#ffffff; --card2:#fbfbfa; --line:#e3e3e0;
    --text:#17181a; --sub:#5a5d63; --accent:#c95a1c; --accent2:#0b6fc9;
    --pill:#eef0f2; --pillText:#3b3e44;
  }
}
:root[data-theme="dark"]{
  --bg:#101114; --card:#1b1d22; --card2:#22252b; --line:#2c2f36;
  --text:#f2f2f0; --sub:#a6a9b0; --accent:#e8722c; --accent2:#3fa6ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px;}
.head{padding:6px 2px 12px;}
.head h1{font-size:19px;margin:0 0 2px;font-weight:700;}
.head p{margin:0;color:var(--sub);font-size:13px;}
.tabs{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:var(--pill,var(--card2));color:var(--sub);white-space:nowrap;border:1px solid var(--line);
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.search{
  width:100%;margin:12px 0 4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-size:14px;
}
.search:focus{outline:none;border-color:var(--accent2);}
.day{display:none;}
.day.active{display:block;}
.sechead{
  font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--sub);
  text-transform:uppercase;margin:20px 4px 8px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;
}
.time{flex:0 0 56px;font-weight:700;font-size:14px;padding-top:1px;}
.body{flex:1;min-width:0;}
.row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:3px;}
.name{font-weight:700;font-size:14px;}
.where{font-size:11px;color:var(--sub);background:var(--pill,var(--card2));border-radius:6px;padding:1px 6px;}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;border-radius:6px;padding:1px 6px;letter-spacing:.03em;}
.b-start{background:#1d9e75;color:#eafff6;}
.b-end{background:#a32d2d;color:#ffecec;}
.b-prep{background:#bA7517;color:#fff6e6;}
.task{font-size:13.5px;color:var(--text);line-height:1.4;white-space:pre-line;}
.crewcard{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.crewcard .name{display:block;margin-bottom:2px;}
.crewcard .time{display:inline;font-weight:600;color:var(--sub);font-size:12px;}
.contact{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin-bottom:8px;
}
.contact .co{font-weight:700;font-size:14px;}
.contact .job{font-size:11px;color:var(--sub);margin-left:6px;}
.contact a{color:var(--accent2);text-decoration:none;font-size:13.5px;}
.contact .who{font-size:13px;color:var(--sub);margin-top:2px;}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:30px 0;}
</style>
</head>

const tabsEl = document.getElementById('tabs');
const daysEl = document.getElementById('days');
const order = ['fri','sat','sun','contacts'];

order.forEach((key,i)=>{
  const t = document.createElement('div');
  t.className = 'tab' + (i===2?' active':'');
  t.textContent = DATA[key].label;
  t.dataset.key = key;
  t.onclick = ()=> selectTab(key);
  tabsEl.appendChild(t);

  const d = document.createElement('div');
  d.className = 'day' + (i===2?' active':'');
  d.id = 'day-'+key;
  daysEl.appendChild(d);
});

function badgeHtml(kind){
  if(kind==='start') return '<span class="badge b-start">Start</span>';
  if(kind==='end') return '<span class="badge b-end">Einde</span>';
  if(kind==='prep') return '<span class="badge b-prep">Prep</span>';
  return '';
}

function renderTimeline(key){
  const el = document.getElementById('day-'+key);
  const items = DATA[key].items;
  let html = '';
  items.forEach(it=>{
    const [time,name,where,task,kind] = it;
    html += `<div class="card" data-search="${(name+' '+where+' '+task).toLowerCase()}">
      <div class="time">${time||'—'}</div>
      <div class="body">
        <div class="row1"><span class="name">${name}</span>${where?`<span class="where">${where}</span>`:''}${badgeHtml(kind)}</div>
        <div class="task">${task}</div>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

function renderCrew(){
  const el = document.getElementById('day-sun');
  let html = '<div class="sechead">STIHL Crew — hoofdtaken</div>';
  DATA.crew.forEach(([time,name,task])=>{
    html += `<div class="crewcard" data-search="${(name+' '+task).toLowerCase()}">
      <span class="name">${name}</span>
      <span class="time">${time}</span>
      <div class="task" style="margin-top:4px;">${task}</div>
    </div>`;
  });
  el.insertAdjacentHTML('beforeend', html);
}

function renderContacts(){
  const el = document.getElementById('day-contacts');
  let html = '';
  DATA.contacts.items.forEach(([co,job,phone,contact,where])=>{
    html += `<div class="contact" data-search="${(co+' '+job+' '+contact+' '+where).toLowerCase()}">
      <div><span class="co">${co}</span><span class="job">${job}</span></div>
      <div class="who">${contact}${where?' · '+where:''}</div>
      <a href="tel:${phone.replace(/\s+/g,'')}">${phone}</a>
    </div>`;
  });
  el.innerHTML = html;
}

renderTimeline('fri');
renderTimeline('sat');
renderTimeline('sun');
renderCrew();
renderContacts();

function selectTab(key){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.key===key));
  document.querySelectorAll('.day').forEach(d=>d.classList.toggle('active', d.id==='day-'+key));
  document.getElementById('search').value='';
  filter('');
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', e=> filter(e.target.value.toLowerCase().trim()));

function filter(q){
  document.querySelectorAll('.day.active [data-search]').forEach(card=>{
    card.style.display = (!q || card.dataset.search.includes(q)) ? '' : 'none';
  });
}
